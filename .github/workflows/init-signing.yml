name: Initialize preview signing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seal_signing:
    name: Generate and seal preview signing key
    runs-on: ubuntu-latest
    env:
      YCODE_HAS_EXISTING_RELEASE_JKS: ${{ secrets.YCODE_RELEASE_JKS_BASE64 != '' }}
      YCODE_SECRETS_PUBLIC_KEY: ${{ vars.YCODE_SECRETS_PUBLIC_KEY }}
      YCODE_SECRETS_KEY_ID: ${{ vars.YCODE_SECRETS_KEY_ID }}
    steps:
      - name: Refuse to replace existing signing key
        shell: bash
        run: |
          if [[ "${YCODE_HAS_EXISTING_RELEASE_JKS:-}" == true ]]; then
            echo "::error::YCODE_RELEASE_JKS_BASE64 已存在；拒绝生成或覆盖签名密钥。"
            exit 1
          fi
          if [[ -z "${YCODE_SECRETS_PUBLIC_KEY:-}" || -z "${YCODE_SECRETS_KEY_ID:-}" ]]; then
            echo "::error::请先设置仓库变量 YCODE_SECRETS_PUBLIC_KEY 和 YCODE_SECRETS_KEY_ID。"
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install sealing dependency
        shell: bash
        run: python -m pip install --disable-pip-version-check --no-input PyNaCl==1.5.0

      - name: Generate and seal signing values
        shell: bash
        run: |
          umask 077
          signing_dir="$(mktemp -d "$RUNNER_TEMP/ycode-signing.XXXXXX")"
          sealed_path="$RUNNER_TEMP/ycode-encrypted-signing.json"
          cleanup() {
            unset YCODE_RELEASE_JKS_BASE64 YCODE_RELEASE_STORE_PASSWORD \
              YCODE_RELEASE_KEY_ALIAS YCODE_RELEASE_KEY_PASSWORD
            rm -rf "$signing_dir"
          }
          trap cleanup EXIT

          keystore="$signing_dir/ycode-preview.jks"
          export YCODE_RELEASE_STORE_PASSWORD="$(openssl rand -hex 32)"
          export YCODE_RELEASE_KEY_PASSWORD="$(openssl rand -hex 32)"
          export YCODE_RELEASE_KEY_ALIAS=ycode-preview
          printf '::add-mask::%s\n' \
            "$YCODE_RELEASE_STORE_PASSWORD" \
            "$YCODE_RELEASE_KEY_PASSWORD" \
            "$YCODE_RELEASE_KEY_ALIAS"

          keytool -genkeypair \
            -alias "$YCODE_RELEASE_KEY_ALIAS" \
            -keyalg RSA \
            -keysize 4096 \
            -validity 36500 \
            -dname 'CN=YCode Preview' \
            -storetype JKS \
            -keystore "$keystore" \
            -storepass:env YCODE_RELEASE_STORE_PASSWORD \
            -keypass:env YCODE_RELEASE_KEY_PASSWORD \
            -noprompt

          export YCODE_RELEASE_JKS_BASE64="$(base64 -w 0 "$keystore")"
          printf '::add-mask::%s\n' "$YCODE_RELEASE_JKS_BASE64"
          python -I tool/seal_signing.py > "$sealed_path"
          chmod 600 "$sealed_path"

      - name: Upload encrypted signing values
        uses: actions/upload-artifact@v4
        with:
          name: ycode-encrypted-signing-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ycode-encrypted-signing.json
          if-no-files-found: error
          retention-days: 1
