name: 功能建议
description: 新功能或改进建议
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 现在哪里不方便，或者缺少什么
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望怎么做
  - type: textarea
    id: context
    attributes:
      label: 补充说明（可选）
      description: 参考截图、使用场景等
