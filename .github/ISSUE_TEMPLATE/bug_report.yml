name: 问题报告
description: 应用出错、崩溃或行为不符合预期
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        安全问题请不要在这里提交，按 SECURITY.md 私下报告。
        截图和日志里请先去掉配对二维码、配对链接、安全码、令牌和真实聊天内容。
  - type: input
    id: app-version
    attributes:
      label: YCode 版本
      description: 「设置 → 当前版本」中显示的版本
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 手机型号和 Android 版本
      placeholder: Pixel 8，Android 15
    validations:
      required: true
  - type: input
    id: desktop-version
    attributes:
      label: 电脑端 BaoCode 版本
      placeholder: 1.9.2
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 点击……
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 实际结果和预期结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 截图或日志（可选）
      description: 已去掉敏感信息的截图或日志
